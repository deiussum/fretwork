<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .tile { fill: #b4531a; }
    .mark { fill: #f7f5f0; stroke: #f7f5f0; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #e0803f; }
      .mark { fill: #16140f; stroke: #16140f; }
    }
  </style>
  <rect class="tile" x="1" y="1" width="30" height="30" rx="7"/>
  <g class="mark" stroke-width="3" stroke-linecap="round">
    <line x1="7" y1="9.5" x2="25" y2="9.5"/>
    <line x1="7" y1="22.5" x2="25" y2="22.5"/>
  </g>
  <circle class="mark" stroke="none" cx="16" cy="16" r="3.2"/>
</svg>
