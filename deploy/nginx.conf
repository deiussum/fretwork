# Fretwork: static app on plain HTTP. Put a TLS proxy in front; browsers only
# allow the microphone on secure pages.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Written at start-up by 40-fretwork-config.sh: off unless FRETWORK_ACCESS_LOG=on.
    include /tmp/fretwork/access-log.conf;

    # Every location includes the security headers: nginx drops inherited
    # add_header lines in a location that adds its own.
    location / {
        include /etc/nginx/fretwork/headers.conf;
        try_files $uri $uri/ =404;
    }

    # Content-hashed files never change.
    location /assets/ {
        include /etc/nginx/fretwork/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Always revalidate, so a new deployment is picked up on the next visit.
    location = /index.html {
        include /etc/nginx/fretwork/headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Operator details for the privacy page, written at start-up.
    location = /config.json {
        include /etc/nginx/fretwork/headers.conf;
        add_header Cache-Control "no-cache" always;
        default_type application/json;
        alias /tmp/fretwork/config.json;
    }
}
